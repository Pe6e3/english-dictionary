name: Auto Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Display version info
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📦 ИНФОРМАЦИЯ О ВЕРСИИ"
          echo "═══════════════════════════════════════════════════════════"
          echo "Коммит:     $(git log -1 --format='%h')"
          echo "Полный ID:  $(git log -1 --format='%H')"
          echo "Сообщение:  $(git log -1 --format='%s')"
          echo "Автор:      $(git log -1 --format='%an')"
          echo "Дата:       $(git log -1 --format='%cd' --date=format:'%Y-%m-%d %H:%M:%S')"
          echo "Ветка:      $(git branch --show-current)"
          echo "═══════════════════════════════════════════════════════════"
      
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 30s
          script: |
            cd /var/www/english
            ./auto-deploy.sh
        continue-on-error: true
        if: ${{ secrets.SSH_HOST != '' && secrets.SSH_USER != '' && secrets.SSH_KEY != '' }}
      
      - name: Deploy notification
        if: failure()
        run: |
          echo "⚠️ GitHub Actions деплой не выполнен (не настроены SSH секреты)"
          echo "Для настройки автоматического деплоя через GitHub Actions:"
          echo "1. Перейдите в Settings → Secrets and variables → Actions"
          echo "2. Добавьте секреты: SSH_HOST, SSH_USER, SSH_KEY"
          echo "3. Подробная инструкция в файле AUTO_DEPLOY_SETUP.md"
          echo ""
          echo "Деплой можно выполнить вручную на сервере:"
          echo "cd /var/www/english && ./auto-deploy.sh"

