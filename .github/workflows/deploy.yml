name: Auto Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Display version info
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "📦 ИНФОРМАЦИЯ О ВЕРСИИ"
          echo "═══════════════════════════════════════════════════════════"
          echo "Коммит:     $(git log -1 --format='%h')"
          echo "Полный ID:  $(git log -1 --format='%H')"
          echo "Сообщение:  $(git log -1 --format='%s')"
          echo "Автор:      $(git log -1 --format='%an')"
          echo "Дата:       $(git log -1 --format='%cd' --date=format:'%Y-%m-%d %H:%M:%S')"
          echo "Ветка:      $(git branch --show-current)"
          echo "═══════════════════════════════════════════════════════════"
      
      - name: Deploy to server via SSH
        id: deploy_ssh
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 30s
          script: |
            cd /var/www/english
            ./auto-deploy.sh
        continue-on-error: true
      
      - name: Send deployment notification
        if: always()
        run: |
          COMMIT_SHORT=$(git log -1 --format='%h')
          COMMIT_FULL=$(git log -1 --format='%H')
          COMMIT_MSG=$(git log -1 --format='%s')
          COMMIT_BODY=$(git log -1 --format='%B' | sed '/^$/d' | head -5 | tr '\n' '; ')
          COMMIT_DATE=$(git log -1 --format='%cd' --date=format:'%Y-%m-%d %H:%M:%S')
          COMMIT_AUTHOR=$(git log -1 --format='%an')
          BRANCH=$(git branch --show-current)
          DEPLOY_TIME=$(date '+%Y-%m-%d %H:%M:%S')
          
          if [ "${{ steps.deploy_ssh.outcome }}" == "success" ]; then
            STATUS="✅ Успешно"
            DETAILS="Деплой выполнен через GitHub Actions"
          else
            STATUS="⚠️ Не выполнен"
            DETAILS="Деплой через GitHub Actions не выполнен (проблема с SSH подключением). Деплой можно выполнить вручную на сервере: cd /var/www/english && ./auto-deploy.sh"
          fi
          
          # Формируем сообщение через printf для избежания проблем с YAML
          MSG_FILE=$(mktemp)
          printf 'Деплой English: %s\n\n📦 Информация о версии:\n• Коммит: %s (%s)\n• Сообщение: %s\n• Автор: %s\n• Дата коммита: %s\n• Ветка: %s\n\n📝 Текст коммита:\n%s\n\n🔄 Статус деплоя:\n%s\n\n⏰ Время: %s\n' \
            "$STATUS" "$COMMIT_SHORT" "$COMMIT_FULL" "$COMMIT_MSG" "$COMMIT_AUTHOR" "$COMMIT_DATE" "$BRANCH" "$COMMIT_BODY" "$DETAILS" "$DEPLOY_TIME" > "$MSG_FILE"
          
          # Формируем JSON и отправляем уведомление
          JSON_DATA=$(python3 -c "import json; f=open('$MSG_FILE', 'r', encoding='utf-8'); msg=f.read(); f.close(); print(json.dumps({'message': msg}, ensure_ascii=False))" 2>/dev/null)
          rm -f "$MSG_FILE"
          
          if [ -n "$JSON_DATA" ] && [ "${#JSON_DATA}" -gt 20 ]; then
            curl -s -X POST \
              -H "Content-Type: application/json" \
              -d "$JSON_DATA" \
              "https://stage.istransit.kz/api/terminals/v01/send_log/" || echo "Не удалось отправить уведомление"
          fi
      
      - name: Deploy notification (fallback)
        if: failure() && steps.deploy_ssh.outcome == 'failure'
        run: |
          echo "⚠️ GitHub Actions деплой не выполнен"
          echo "Проверьте:"
          echo "1. Настроены ли секреты: SSH_HOST, SSH_USER, SSH_KEY"
          echo "2. Правильность значений секретов"
          echo "3. Доступность сервера по SSH"
          echo ""
          echo "Подробная инструкция в файле AUTO_DEPLOY_SETUP.md"

